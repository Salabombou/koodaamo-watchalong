[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koodaamo-watchalong"
version = "0.2.0"
description = "Serverless peer-to-peer video watchalong (libtorrent + MQTT + PySide6/QML)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "libtorrent>=2.0.7",
    "paho-mqtt>=2.0",
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "requests>=2.31",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
win = ["pywin32>=306"]
build = [
    "pyinstaller>=6.6",
    "pyinstaller-hooks-contrib>=2024.9",
]

[project.scripts]
watchalong = "watchalong.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watchalong = ["ui/*.qml", "ui/qmldir", "ui/*.txt", "ui/icons/*", "ui/fonts/*", "ui/sounds/*"]
