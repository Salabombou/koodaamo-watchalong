name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build portable + installer
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -Variant both

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KoodaamoWatchalong-windows
          path: |
            dist/KoodaamoWatchalong.exe
            dist/KoodaamoWatchalong-Setup.exe
          if-no-files-found: error

  linux-appimage:
    # Build on the oldest supported runner: glibc is backward- but not
    # forward-compatible, so this lets the binaries run on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6 file

      - name: Build portable binary + AppImage
        run: bash scripts/build-linux.sh --variant both

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KoodaamoWatchalong-linux
          path: |
            dist/KoodaamoWatchalong-x86_64.AppImage
            dist/KoodaamoWatchalong-linux-x86_64
          if-no-files-found: error

  # Publish once, after every build has succeeded. Separate per-job publishing
  # raced on creating the release and could leave it with missing assets.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-exe, linux-appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KoodaamoWatchalong.exe
            dist/KoodaamoWatchalong-Setup.exe
            dist/KoodaamoWatchalong-x86_64.AppImage
            dist/KoodaamoWatchalong-linux-x86_64
          fail_on_unmatched_files: true
          generate_release_notes: true
