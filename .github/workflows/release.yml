name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build portable + installer
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -Variant both

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KoodaamoWatchalong-windows
          path: |
            dist/KoodaamoWatchalong.exe
            dist/KoodaamoWatchalong-Setup.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KoodaamoWatchalong.exe
            dist/KoodaamoWatchalong-Setup.exe
          generate_release_notes: true

  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6 file

      - name: Build portable + AppImage
        run: bash scripts/build-linux.sh --variant both

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KoodaamoWatchalong-linux
          path: |
            dist/KoodaamoWatchalong-x86_64.AppImage
            dist/KoodaamoWatchalong-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KoodaamoWatchalong-x86_64.AppImage
            dist/KoodaamoWatchalong-linux-x86_64.tar.gz
          generate_release_notes: true
